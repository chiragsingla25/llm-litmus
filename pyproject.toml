[project]
name = "llm-litmus"
version = "0.1.0"
description = "Local LLM evaluation suite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.2",
    "uvicorn>=0.51.0",
    "httpx>=0.28.1",
    "datasets>=5.0.0",
    "pandas>=3.0.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
